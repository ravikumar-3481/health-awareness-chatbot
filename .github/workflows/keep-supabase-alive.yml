name: Keep Supabase Alive

on:
  schedule:
    # Har 3 din mein raat 12 baje (UTC) chalega
    - cron: '0 0 */3 * *'
  # Manually run karne ke liye option
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase
        run: |
          echo "Pinging Supabase at $(date -u)"
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Response code: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Supabase is alive and responded (HTTP $response)"
          else
            echo "⚠️ Warning: Unexpected response code $response"
            exit 1
          fi
