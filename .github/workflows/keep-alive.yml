name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 min idle)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # lets you manually trigger it from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" https://health-awareness-chatbot-5.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: backend did not return 200"
            exit 1
          fi
